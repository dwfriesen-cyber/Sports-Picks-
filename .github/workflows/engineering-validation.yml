name: Full engineering validation
on:
  push:
    branches: [build/v6-v7a-starter]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_history.py
      - run: python scripts/validate_nfl.py
      - name: Complete original historical raw sources and NFL current ingestion
        run: python scripts/recover_deep_inputs.py
      - name: Real daily pipeline and pregame freeze
        run: python pipeline.py
      - name: Verify artifact contains real predictions
        run: |
          python - <<'PY'
          import json
          r=json.load(open('state/latest.json'))
          assert r['nhl']['status']=='frozen', r['nhl']
          assert len(r['nhl']['slate']['picks']) > 0
          assert r['nfl']['v1_status']=='frozen', r['nfl']
          assert sum(len(s['picks']) for s in r['nfl']['slates'])>0
          assert r['nfl']['v3_status']=='blocked'
          assert r['v8']['status'] in ('frozen','preserved_historical')
          assert all(p['winner'] in (p['home'],p['away']) and p['rank'] for p in r['nhl']['slate']['picks'])
          print('Verified actual predictions:',len(r['nhl']['slate']['picks']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            reports/
            state/
            recovery/
          if-no-files-found: error
          retention-days: 3
