name: Daily frozen sports predictions
on:
  schedule:
    # Saskatchewan UTC-6 year-round. Earlier 05:37/05:53 probes and 06:09/06:29/06:47 recovery.
    # Cron is best-effort. Extra staggered attempts mitigate missed/late starts; immutable freeze remains authoritative.
    - cron: '37,53 11 * * *'
    - cron: '9,29,47 12 * * *'
  workflow_dispatch:
    # 2026-10-24 recovery trigger: scheduled window missed; model/input SHA and freeze guards unchanged.
  push:
    branches: [main]
    paths: [.github/workflows/daily-picks.yml]
permissions:
  contents: write
concurrency:
  group: sports-picks-daily-ledger
  cancel-in-progress: false
env:
  SPORTS_SOURCE_SHA: 073a17d3849db83f684a8273dec77993742eec5d
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SPORTS_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: picks-data
          path: state
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen formulas and safety checks
        run: python -m unittest discover -s tests -v
      - name: Download, calculate, freeze, and grade
        id: pipeline
        continue-on-error: true
        run: python pipeline.py --state state
      - name: Persist auditable results and explicit failure status
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          python scripts/validate_state_change.py state
          git -C state config user.name 'Sports Picks automation'
          git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C state add --all
          if ! git -C state diff --cached --quiet; then
            git -C state commit -m "Freeze and grade sports predictions: ${GITHUB_RUN_ID}"
            git -C state push origin HEAD:picks-data
          fi
      - name: Verify today's NHL freeze and emit diagnostic
        if: always() && steps.pipeline.outcome != 'skipped'
        shell: bash
        run: |
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('state/latest.json')
          if not p.exists(): raise SystemExit('NHL_FREEZE_MISSING: state/latest.json absent')
          d=json.loads(p.read_text())
          day=datetime.datetime.now(ZoneInfo('America/Regina')).date().isoformat()
          status=d.get('nhl',{}).get('status')
          frozen=d.get('nhl',{}).get('slate',{}).get('frozen_at')
          print(f'DAILY_NHL_CHECK expected={day} reported={d.get("report_date")} status={status} frozen_at={frozen} run_id={os.getenv("GITHUB_RUN_ID")}')
          if d.get('report_date')!=day or status not in ('frozen','no_games'):
            raise SystemExit('NHL_FREEZE_UNAVAILABLE: inspect earlier pipeline download/errors; no stale picks permitted')
          PY
      - name: Retain compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: state/latest.json
          if-no-files-found: error
          retention-days: 3
      - name: Expose data or calculation failures
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
