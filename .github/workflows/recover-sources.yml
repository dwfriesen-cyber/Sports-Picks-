name: Recover real source data
on:
  push:
    branches: [build/v6-v7a-starter]
    paths: [scripts/recover_sources.py, .github/workflows/recover-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/recover_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-real-data
          path: recovery/
          if-no-files-found: error
          retention-days: 3
