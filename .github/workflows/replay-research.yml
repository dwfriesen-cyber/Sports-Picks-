name: V6 retrospective research audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-research.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v6-v7a-starter
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test engine and ingestion
        run: python -m unittest discover -s tests -v
      - name: Fetch completed regular season games
        run: python ingest_nhl.py --start 2026-10-06 --end 2026-10-22 --output data/nhl_games.csv
      - name: Replay V6 from prior-day inputs
        run: python engine.py --games data/nhl_games.csv --from-date 2026-10-18 --output data/v6_retrospective.json
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-research-audit
          path: data/
          if-no-files-found: warn
          retention-days: 14
